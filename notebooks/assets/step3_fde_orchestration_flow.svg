<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 15px; font-weight: 700; fill: #202124; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 600; fill: #5f6368; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; fill: #3c4043; line-height: 1.4; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10.5px; fill: #1a73e8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 10px; font-weight: 600; fill: #ffffff; }
      .card-bg { rx: 8px; stroke-width: 1px; }
      .sub-card { rx: 6px; fill: #ffffff; stroke: #dadce0; stroke-width: 1px; }
      .step-bubble { rx: 12px; fill: #1a73e8; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="360" fill="#f8f9fa" rx="10" stroke="#dadce0" stroke-width="1"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1020" height="42" fill="#ffffff" rx="10" stroke="#dadce0" stroke-width="1"/>
  <rect x="20" y="11" width="76" height="20" rx="4" fill="#1a73e8"/>
  <text x="58" y="25" text-anchor="middle" class="badge-text">STEP 3</text>
  <text x="108" y="26" class="title">Tier 3 Domain MCP &amp; AI FDE 자율 추론 시퀀셜 체이닝 (Cognitive Decoupling)</text>
  <text x="860" y="26" class="subtitle">0% Hallucination Math · Golden CQ 100%</text>

  <!-- Column 1: Complex Query & Phase 1 Sub-Goals -->
  <g transform="translate(20, 60)">
    <rect width="225" height="280" fill="#e8f0fe" stroke="#aecbfa" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="201" height="26" rx="4" fill="#1a73e8"/>
    <text x="112" y="29" text-anchor="middle" class="badge-text">Phase 1: 동적 하위 목표 분해</text>

    <!-- Sub-card 1: Input -->
    <rect x="12" y="48" width="201" height="85" class="sub-card"/>
    <text x="20" y="68" class="subtitle">복합 엔터프라이즈 질의</text>
    <text x="20" y="86" class="body-text">"Galaxy S26 Ultra 지원금 정책과"</text>
    <text x="20" y="102" class="body-text">"관련 원천 DW 테이블 스키마와"</text>
    <text x="20" y="118" class="body-text">"실제 레코드 볼륨을 확인해줘"</text>

    <!-- Sub-card 2: Sub-Goals -->
    <rect x="12" y="143" width="201" height="115" class="sub-card"/>
    <text x="20" y="163" class="subtitle">동적 분해 하위 목표 (Sub-Goals)</text>
    <text x="20" y="181" class="body-text" font-weight="bold" fill="#1a73e8">[G-BIZ-01] 공시지원금 산출</text>
    <text x="20" y="196" class="code-text">➔ mcp_get_device_subsidy</text>
    <text x="20" y="216" class="body-text" font-weight="bold" fill="#137333">[G-ENG-01] DW 스키마/볼륨 실측</text>
    <text x="20" y="231" class="code-text">➔ mcp_inspect_dw_table</text>
    <text x="20" y="248" class="body-text" fill="#5f6368">✔ 인지 과부하 격리 달성</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="247" y1="200" x2="275" y2="200" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: Phase 2 Business Tool Dispatch -->
  <g transform="translate(280, 60)">
    <rect width="225" height="280" fill="#f3e8fd" stroke="#d7aefb" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="201" height="26" rx="4" fill="#9334e8"/>
    <text x="112" y="29" text-anchor="middle" class="badge-text">Phase 2: 비즈니스 도구 디스패치</text>

    <rect x="12" y="48" width="201" height="95" class="sub-card"/>
    <text x="20" y="68" class="subtitle">Business MCP Tool 실행</text>
    <text x="20" y="86" class="code-text">mcp_get_device_subsidy_by_plan</text>
    <text x="20" y="104" class="body-text">• 단말: Galaxy S26 Ultra</text>
    <text x="20" y="120" class="body-text">• 요금제: 5G Premier (85,000원)</text>
    <text x="20" y="136" class="body-text">• 총지원금: <tspan font-weight="bold" fill="#1a73e8">517,500원</tspan></text>

    <rect x="12" y="153" width="201" height="105" class="sub-card"/>
    <text x="20" y="173" class="subtitle">Intermediate Observation 1</text>
    <text x="20" y="191" class="body-text">의무 유지: 180일 (식스플랜)</text>
    <text x="20" y="209" class="body-text">원천 테이블 핸드오프:</text>
    <text x="20" y="226" class="code-text">dw_subsidy_policy_master</text>
    <text x="20" y="244" class="body-text" fill="#137333">➔ 엔지니어링 체이닝 파라미터 전달</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="507" y1="200" x2="535" y2="200" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: Phase 3 Engineering Cross-Chaining -->
  <g transform="translate(540, 60)">
    <rect width="225" height="280" fill="#e6f4ea" stroke="#ceead6" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="201" height="26" rx="4" fill="#137333"/>
    <text x="112" y="29" text-anchor="middle" class="badge-text">Phase 3: 엔지니어링 크로스 체이닝</text>

    <rect x="12" y="48" width="201" height="95" class="sub-card"/>
    <text x="20" y="68" class="subtitle">Engineering MCP Tool 실행</text>
    <text x="20" y="86" class="code-text">mcp_inspect_dw_table_schema</text>
    <text x="20" y="104" class="body-text">• 대상: dw_subsidy_policy_master</text>
    <text x="20" y="120" class="body-text">• 스키마 컬럼 8개 실측 확인</text>
    <text x="20" y="136" class="body-text">• 물리 행수: <tspan font-weight="bold" fill="#137333">1,240 rows</tspan></text>

    <rect x="12" y="153" width="201" height="105" class="sub-card"/>
    <text x="20" y="173" class="subtitle">Intermediate Observation 2</text>
    <text x="20" y="191" class="body-text">• Dataplex 카탈로그 태그 일치</text>
    <text x="20" y="209" class="body-text">• BigQuery 물리 테이블 정상 확인</text>
    <text x="20" y="227" class="body-text" fill="#1a73e8">✔ 정형 원장 무결성 교차 검증</text>
    <text x="20" y="244" class="body-text" fill="#137333">➔ 종합 합성 리포트로 전달</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="767" y1="200" x2="795" y2="200" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 4: Phase 4 Synthesis & Golden Benchmark -->
  <g transform="translate(800, 60)">
    <rect width="200" height="280" fill="#ffffff" stroke="#dadce0" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="10" y="12" width="180" height="26" rx="4" fill="#3c4043"/>
    <text x="100" y="29" text-anchor="middle" class="badge-text">Phase 4: 결정론적 합성 &amp; 검증</text>

    <rect x="10" y="48" width="180" height="85" class="sub-card"/>
    <text x="18" y="68" class="subtitle" fill="#1a73e8">180일 일할 위약금 계산</text>
    <text x="18" y="86" class="body-text">120일 하향 시: <tspan font-weight="bold">100,000원</tspan></text>
    <text x="18" y="103" class="body-text">만 65세 시니어: <tspan font-weight="bold" fill="#137333">0원 (전액면제)</tspan></text>
    <text x="18" y="120" class="body-text" fill="#137333">✔ 0% 환각 수학적 결정론성</text>

    <rect x="10" y="143" width="180" height="115" class="sub-card"/>
    <text x="18" y="163" class="subtitle" fill="#e37400">Golden CQ 20대 벤치마크</text>
    <text x="18" y="181" class="body-text">• 평가 질문: 20문항 전수</text>
    <text x="18" y="198" class="body-text">• 정답률: <tspan font-weight="bold" fill="#137333">100.0% Pass</tspan></text>
    <text x="18" y="215" class="body-text">• 환각률: <tspan font-weight="bold" fill="#137333">0.0% (Zero)</tspan></text>
    <text x="18" y="233" class="body-text">• 법적 근거: 해시 앵커 100% 바인딩</text>
    <text x="18" y="249" class="subtitle" fill="#1a73e8">➔ 프로덕션 준비 완료</text>
  </g>
</svg>
