<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 15px; font-weight: 700; fill: #202124; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 600; fill: #5f6368; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; fill: #3c4043; line-height: 1.4; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10.5px; fill: #1a73e8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 10px; font-weight: 600; fill: #ffffff; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 700; fill: #202124; }
      .card-bg { rx: 8px; stroke-width: 1px; }
      .sub-card { rx: 6px; fill: #ffffff; stroke: #dadce0; stroke-width: 1px; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#137333"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="340" fill="#f8f9fa" rx="10" stroke="#dadce0" stroke-width="1"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1020" height="42" fill="#ffffff" rx="10" stroke="#dadce0" stroke-width="1"/>
  <rect x="20" y="11" width="76" height="20" rx="4" fill="#1a73e8"/>
  <text x="58" y="25" text-anchor="middle" class="badge-text">STEP 2</text>
  <text x="108" y="26" class="title">BigQuery Property Graph &amp; 2-Layer 안티 리던던시 토폴로지 (Zero-Copy GQL)</text>
  <text x="880" y="26" class="subtitle">ISO SQL:2023 · Zero ETL Lag</text>

  <!-- Stage 1: Structured DW Master Direct Promotion -->
  <g transform="translate(20, 60)">
    <rect width="225" height="255" fill="#e8f0fe" stroke="#aecbfa" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="201" height="26" rx="4" fill="#1a73e8"/>
    <text x="112" y="29" text-anchor="middle" class="badge-text">1. DW 원장 직접 승격 (Zero-Copy)</text>

    <rect x="12" y="48" width="201" height="50" class="sub-card"/>
    <text x="22" y="68" class="subtitle">단말 마스터 원장</text>
    <text x="22" y="85" class="code-text">dw_device_master ➔ DeviceNode</text>

    <rect x="12" y="106" width="201" height="50" class="sub-card"/>
    <text x="22" y="126" class="subtitle">요금제 마스터 원장</text>
    <text x="22" y="143" class="code-text">dw_plan_master ➔ PlanNode</text>

    <rect x="12" y="164" width="201" height="50" class="sub-card"/>
    <text x="22" y="184" class="subtitle">공시지원금 정책 원장</text>
    <text x="22" y="201" class="code-text">dw_subsidy_policy_master</text>

    <rect x="12" y="222" width="201" height="25" rx="4" fill="#ffffff" stroke="#1a73e8"/>
    <text x="112" y="239" text-anchor="middle" class="body-text" fill="#1a73e8" font-weight="bold">✔ 그래프 복제 ETL 0건 (비용 80% 절감)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="247" y1="187" x2="275" y2="187" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stage 2: 2-Layer Anti-Redundancy & Topology -->
  <g transform="translate(280, 60)">
    <rect width="250" height="255" fill="#ffffff" stroke="#dadce0" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="226" height="26" rx="4" fill="#3c4043"/>
    <text x="125" y="29" text-anchor="middle" class="badge-text">2. 2-Layer 안티 리던던시 토폴로지</text>

    <!-- Node Boxes in Topology -->
    <rect x="16" y="50" width="102" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="67" y="72" text-anchor="middle" class="node-text" fill="#1a73e8">DeviceNode</text>

    <rect x="132" y="50" width="102" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="183" y="72" text-anchor="middle" class="node-text" fill="#1a73e8">PlanNode</text>

    <rect x="74" y="102" width="102" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="125" y="124" text-anchor="middle" class="node-text" fill="#1a73e8">SubsidyNode</text>

    <!-- Arrows in Topology -->
    <line x1="105" y1="102" x2="80" y2="86" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <line x1="145" y1="102" x2="170" y2="86" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <rect x="74" y="154" width="102" height="36" rx="4" fill="#f3e8fd" stroke="#9334e8"/>
    <text x="125" y="176" text-anchor="middle" class="node-text" fill="#9334e8">DomainRule</text>

    <rect x="74" y="206" width="102" height="36" rx="4" fill="#f3e8fd" stroke="#9334e8"/>
    <text x="125" y="228" text-anchor="middle" class="node-text" fill="#9334e8">DocChunk</text>

    <!-- Cross bridge arrow -->
    <line x1="125" y1="206" x2="125" y2="190" stroke="#9334e8" stroke-width="1.5"/>
    <path d="M 125 154 L 125 142 Q 125 120 160 88" fill="none" stroke="#137333" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
    <text x="175" y="120" class="subtitle" fill="#137333">APPLIES</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="532" y1="187" x2="558" y2="187" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stage 3: DDL Synthesis & GQL -->
  <g transform="translate(562, 60)">
    <rect width="225" height="255" fill="#fef7e0" stroke="#fce8b2" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="201" height="26" rx="4" fill="#e37400"/>
    <text x="112" y="29" text-anchor="middle" class="badge-text">3. SQL:2023 DDL &amp; GQL 질의</text>

    <rect x="12" y="48" width="201" height="65" class="sub-card"/>
    <text x="22" y="68" class="subtitle">선언적 그래프 DDL 합성</text>
    <text x="22" y="86" class="code-text">CREATE PROPERTY GRAPH ...</text>
    <text x="22" y="102" class="body-text">• NODE &amp; EDGE TABLES 바인딩</text>

    <rect x="12" y="123" width="201" height="115" class="sub-card"/>
    <text x="22" y="143" class="subtitle">GQL GRAPH_TABLE() 4-Hop</text>
    <text x="22" y="161" class="body-text">MATCH (d)&lt;-[s]-(p),</text>
    <text x="22" y="177" class="body-text">      (r)-[a]-&gt;(p), (r)-[g]-&gt;(c)</text>
    <text x="22" y="195" class="body-text">• 단일 쿼리로 정형 원장과</text>
    <text x="22" y="211" class="body-text">  비정형 규정 증거 동시 순회</text>
    <text x="22" y="227" class="code-text" fill="#137333">✔ 0.05초 초고속 조회</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="789" y1="187" x2="815" y2="187" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stage 4: Crucial CE Takeaway (The Remote MCP Gap) -->
  <g transform="translate(820, 60)">
    <rect width="180" height="255" fill="#fce8e6" stroke="#fad2cf" class="card-bg" filter="url(#card-shadow)"/>
    <rect x="10" y="12" width="160" height="26" rx="4" fill="#d93025"/>
    <text x="90" y="29" text-anchor="middle" class="badge-text">4. The Remote MCP Gap</text>

    <rect x="10" y="48" width="160" height="90" class="sub-card"/>
    <text x="18" y="68" class="subtitle" fill="#d93025">공식 BQ Remote MCP</text>
    <text x="18" y="86" class="code-text">execute_sql_readonly</text>
    <text x="18" y="104" class="body-text" fill="#d93025">⚠ GQL 문법 미지원!</text>
    <text x="18" y="122" class="body-text">(GRAPH_TABLE 파싱 에러)</text>

    <rect x="10" y="148" width="160" height="95" class="sub-card"/>
    <text x="18" y="168" class="subtitle" fill="#137333">GCP CE 핵심 해법</text>
    <text x="18" y="186" class="body-text"><tspan font-weight="bold">Tier 3 Domain MCP</tspan></text>
    <text x="18" y="202" class="body-text">계층으로 GQL을 캡슐화</text>
    <text x="18" y="218" class="body-text">하여 에이전트 인지 보호</text>
    <text x="18" y="234" class="code-text" fill="#137333">➔ Step 3에서 통합</text>
  </g>
</svg>
